name: Publish catalog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate catalog
        run: python3 scripts/generate-catalog.py

      - name: Commit catalog if the model set changed
        run: |
          # updated_at changes every run; only commit when a model entry changed.
          if git diff --quiet -I '"updated_at"' -- model-catalog.json; then
            echo "Model set unchanged; keeping the committed catalog."
            git checkout -- model-catalog.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-catalog.json
          git commit -m "chore: refresh OpenRouter model catalog"
          git push

      - name: Render site
        run: python3 scripts/render-page.py --site-dir site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
